<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>稽核系統｜麻的小辛辣</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

<header id="app-header">
  <h1>月初盤點及金庫抽查</h1>
</header>

<nav id="main-nav" hidden>
  <button type="button" class="nav-btn" data-view="overview">總覽</button>
  <button type="button" class="nav-btn" data-view="audit">稽核填寫</button>
  <button type="button" class="nav-btn" data-view="report">報告</button>
  <button type="button" class="nav-btn" data-view="analysis">異常分析</button>
</nav>

<main id="app-main">

  <section id="view-login" class="view">
    <!-- 登入畫面：通行碼輸入，js/views/login.js 填內容 -->
  </section>

  <section id="view-overview" class="view" hidden>
    <!-- 總覽：5 店 × 12 月狀態格，js/views/overview.js 填內容 -->
  </section>

  <section id="view-audit" class="view" hidden>
    <!-- 稽核填寫（會計限定），js/views/audit.js 填內容 -->
  </section>

  <section id="view-report" class="view" hidden>
    <!-- 報告（可列印），js/views/report.js 填內容 -->
  </section>

  <section id="view-analysis" class="view" hidden>
    <!-- 異常分析，js/views/analysis.js 填內容 -->
  </section>

</main>

<!-- 全域物件，順序：config → format → sampling → mock-data → api → views/* → app -->
<script src="js/config.js"></script>
<script src="js/format.js"></script>
<script src="js/sampling.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/audit.js"></script>
<script src="js/views/report.js"></script>
<script src="js/views/analysis.js"></script>
<script src="js/app.js"></script>

</body>
</html>
